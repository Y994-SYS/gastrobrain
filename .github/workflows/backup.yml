name: Gunluk Veritabani Yedegi

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  yedekle:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL 17 client kur
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Yedek al (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          TARIH=$(date +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom --file="gastrobrain_${TARIH}.dump"
          gzip "gastrobrain_${TARIH}.dump"

      - name: Yedegi GitHub Actions'a yukle (90 gun saklanir)
        uses: actions/upload-artifact@v4
        with:
          name: db-yedek-${{ github.run_id }}
          path: "*.dump.gz"
          retention-days: 90
